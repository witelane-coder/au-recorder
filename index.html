<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест (Шаг 4 — финал)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status { 
        margin-top: 12px; 
        font-size: 0.9rem; 
        color: #555; 
        min-height: 1.2em; 
        line-height: 1.4; 
        border: 1px dashed #ccc;
        padding: 8px;
        border-radius: 8px;
        background: white;
        text-align: center;
      }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; }
      #stopBtn {
        background-color: #ff3b30;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        display: none;
      }
      .controls-area {
        margin-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 320px;
      }
      audio { width: 100%; border-radius: 10px; background: #fff; }
      a.download-link {
        display: block;
        text-align: center;
        padding: 14px;
        background-color: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Тест рекордера — Шаг 4</h1>
    <button id="startBtn">Начать запись</button>
    <button id="stopBtn">Стоп</button>
    <div class="status" id="status"></div>

    <div class="controls-area" id="controlsArea" style="display:none;">
      <!-- Сюда вставим плеер и кнопку -->
    </div>

    <script>
      let recorder = null;
      const chunks = [];
      let lastUrl = null; // Чтобы освобождать память
      
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const status = document.getElementById('status');
      const controlsArea = document.getElementById('controlsArea');

      startBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          // На iPhone НЕ указываем mimeType — Safari сам выберет совместимый формат
          recorder = new MediaRecorder(stream);

          recorder.ondataavailable = (event) => {
            chunks.push(event.data);
            status.textContent = `Пишу... (кусков: ${chunks.length})`;
          };

          recorder.onstop = () => {
            // ГЛАВНОЕ: собираем все кусочки в один Blob
            const blob = new Blob(chunks, { type: 'audio/mp4' });
            chunks.length = 0; // Очищаем массив, чтобы не копилось при новых записях

            // Освобождаем старую ссылку, если была
            if (lastUrl) URL.revokeObjectURL(lastUrl);

            lastUrl = URL.createObjectURL(blob);

            // Показываем плеер и кнопку
            controlsArea.style.display = 'flex';
            controlsArea.innerHTML = `
              <audio controls src="${lastUrl}"></audio>
              <a href="${lastUrl}" download="recording.mp4" class="download-link">⬇️ Скачать recording.mp4</a>
            `;

            status.textContent = '✅ Готово! Можно послушать и скачать.';
          };

          recorder.start();
          
          startBtn.disabled = true;
          stopBtn.style.display = 'block';
          stopBtn.disabled = false;
          status.textContent = '🎙️ Запись идёт... Говори!';

        } catch (err) {
          console.error(err);
          if (err.name === 'NotAllowedError') {
            status.innerHTML = '❌ Доступ запрещён. Нажми “Разрешить” в окне Safari.';
          } else if (err.name === 'SecurityError') {
            status.innerHTML = '❌ Нужен HTTPS (GitHub Pages). По HTTP Safari не даст доступ к микрофону.';
          } else {
            status.textContent = `❌ Ошибка: ${err.message}`;
          }
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recorder) {
          recorder.stop(); // Это вызовет onstop и соберёт файл
          stopBtn.disabled = true;
        }
      });
    </script>
  </body>
</html>
