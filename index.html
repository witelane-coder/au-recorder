<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест (Шаг 3 — исправлено)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status { 
        margin-top: 12px; 
        font-size: 0.9rem; 
        color: #555; 
        min-height: 1.2em; 
        line-height: 1.4; 
        border: 1px dashed #ccc;
        padding: 8px;
        border-radius: 8px;
        background: white;
        text-align: center;
      }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; }
      #stopBtn {
        background-color: #ff3b30;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Тест рекордера — Шаг 3 (фикс)</h1>
    <button id="startBtn">Начать запись</button>
    <button id="stopBtn">Стоп</button>
    <div class="status" id="status"></div>

    <script>
      let recorder = null;
      const chunks = [];
      
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const status = document.getElementById('status');

      startBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          // ВАЖНО: на iPhone НЕ указываем mimeType — иначе будет ошибка NotSupportedError.
          // Safari сам выберет правильный формат (AAC).
          recorder = new MediaRecorder(stream);

          recorder.ondataavailable = (event) => {
            chunks.push(event.data);
            status.textContent = `Пишу... (кусков: ${chunks.length})`;
          };

          recorder.onstop = () => {
            status.textContent = 'Запись остановлена. Ждём Шаг 4...';
          };

          recorder.start();
          
          startBtn.disabled = true;
          stopBtn.style.display = 'block';
          stopBtn.disabled = false;
          status.textContent = '🎙️ Запись идёт... Говори!';

        } catch (err) {
          console.error(err);
          if (err.name === 'NotAllowedError') {
            status.innerHTML = '❌ Доступ запрещён. Нажми “Разрешить” в окне Safari.';
          } else if (err.name === 'SecurityError') {
            status.innerHTML = '❌ Нужен HTTPS (GitHub Pages). По HTTP Safari не даст доступ к микрофону.';
          } else {
            status.textContent = `❌ Ошибка: ${err.message}`;
          }
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recorder) {
          recorder.stop();
          stopBtn.disabled = true;
        }
      });
    </script>
  </body>
</html>
