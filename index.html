<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест (Шаг 1)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status { margin-top: 12px; font-size: 0.9rem; color: #555; min-height: 1.2em; }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; }
    </style>
  </head>
  <body>
    <h1>Тест рекордера — Шаг 1</h1>
    <button id="startBtn">Начать запись</button>
    <div class="status" id="status"></div>

    <script>
      const startBtn = document.getElementById('startBtn');
      const status = document.getElementById('status');

      startBtn.addEventListener('click', () => {
        status.textContent = 'Кнопка работает! Переходим к шагу 2.';
      });
    </script>
  </body>
</html>
