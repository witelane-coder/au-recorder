<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест: точная диагностика</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status {
        margin-top: 12px;
        font-size: 0.9rem;
        color: #555;
        min-height: 1.2em;
        line-height: 1.4;
        text-align: left;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 8px;
        background: white;
      }
      .status.error { color: #d9534f; border-color: #d9534f; }
      .status.success { color: #28a745; border-color: #28a745; }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #initBtn { background-color: #888; width: 100%; max-width: 300px; }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; display: none; }
      #stopBtn {
        background-color: #ff3b30;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        display: none;
      }
      .controls-box { margin-top: 15px; text-align: center; width: 100%; }
      audio {
        width: 100%;
        background: white;
        border-radius: 8px;
        padding: 6px;
      }
      a.download-link {
        display: inline-block;
        margin-top: 10px;
        padding: 12px 20px;
        background-color: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Тест рекордера: диагностика</h1>

    <!-- Кнопка-заглушка: обязательна для iOS, чтобы появился запрос доступа -->
    <button id="initBtn">Нажми сюда, чтобы разрешить микрофон</button>
    <button id="startBtn">Начать запись</button>
    <button id="stopBtn" disabled>Стоп</button>
    <div class="status" id="status"></div>

    <script>
      let recorder = null;
      const chunks = [];
      let lastUrl = null; // ссылка на Blob в памяти

      const initBtn = document.getElementById('initBtn');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const status = document.getElementById('status');

      // Шаг 1: сначала показываем кнопку-заглушку, чтобы «разблокировать» браузер
      initBtn.addEventListener('click', () => {
        initBtn.style.display = 'none';
        startBtn.style.display = 'block';
        status.className = '';
        status.textContent = 'Теперь нажми “Начать запись”';
      });

      // Шаг 2: запрашиваем микрофон только после «доверенного действия»
      startBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);

          // Отслеживаем, пишет ли браузер вообще куски аудио
          recorder.ondataavailable = e => {
            chunks.push(e.data);
            console.log('✅ Записан кусок аудио:', e.data.size, 'байт');
          };

          recorder.onstop = () => {
            // Освобождаем предыдущую ссылку, чтобы не забивать память
            if (lastUrl) URL.revokeObjectURL(lastUrl);

            status.className = '';

            if (chunks.length === 0) {
              status.className = 'error';
              status.innerHTML = `
                <b>⚠️ Запись пуста</b><br>
                Браузер не записал ни одного куска аудио.<br>
                Возможные причины:<br>
                1. Не дал разрешение на микрофон (или нажал «Запретить»).<br>
                2. Микрофон физически выключен.<br>
                3. В настройках Safari сброшены разрешения для сайта.
              `;
              return;
            }

            const blob = new Blob(chunks, { type: 'audio/webm' });
            chunks.length = 0; // очищаем массив

            lastUrl = URL.createObjectURL(blob);

            // Показываем плеер и кнопку скачивания
            status.className = 'success';
            status.innerHTML = `
              <b>✅ Готово!</b><br>
              Записано кусков: ${chunks.length || 'N/A'} (в памяти уже очищено)<br>
              <div class="controls-box">
                <audio controls src="${lastUrl}"></audio>
                <br>
                <a href="${lastUrl}" download="recording.webm" class="download-link">⬇️ Скачать .webm</a>
              </div>
            `;
          };

          recorder.start();
          startBtn.disabled = true;
          stopBtn.style.display = 'block';
          stopBtn.disabled = false;
          status.className = '';
          status.textContent = 'Запись... (скажи что-нибудь)';
        } catch (err) {
          console.error(err);
          status.className = 'error';
          // Показываем понятную причину ошибки
          if (err.name === 'NotAllowedError') {
            status.innerHTML = '<b>❌ Нет доступа к микрофону</b><br>Ты нажал “Запретить” или разрешение сброшено в настройках Safari.';
          } else if (err.name === 'NotFoundError') {
            status.innerHTML = '<b>❌ Микрофон не найден</b><br>Устройство не видит аудиовход (проверь, не выключен ли физически).';
          } else {
            status.innerHTML = `<b>❌ Ошибка:</b> ${err.message || 'Неизвестная ошибка'}<br>Смотри консоль (F12) для деталей.`;
          }
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recorder) recorder.stop();
      });
    </script>
  </body>
</html>
