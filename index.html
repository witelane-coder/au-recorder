<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест на хостинге</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status { margin-top: 12px; font-size: 0.9rem; color: #555; min-height: 1.2em; }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #initBtn { background-color: #888; width: 100%; max-width: 300px; }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; display: none; }
      #stopBtn {
        background-color: #ff3b30;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        display: none;
      }
      .action-buttons button {
        margin-top: 10px;
        padding: 12px 20px;
      }
      a.download-link {
        display: inline-block;
        margin-top: 10px;
        padding: 12px 20px;
        background-color: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Тест рекордера</h1>

    <!-- Кнопка-заглушка: нужна именно для iOS, чтобы появился запрос доступа -->
    <button id="initBtn">Нажми сюда, чтобы разрешить микрофон</button>

    <button id="startBtn">Начать запись</button>
    <button id="stopBtn" disabled>Стоп</button>
    <div class="status" id="status"></div>

    <script>
      let recorder = null;
      const chunks = [];
      let lastUrl = null; // для освобождения памяти

      const initBtn = document.getElementById('initBtn');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const status = document.getElementById('status');

      // Шаг 1: сначала показываем кнопку-заглушку, чтобы «разблокировать» браузер
      initBtn.addEventListener('click', () => {
        initBtn.style.display = 'none';
        startBtn.style.display = 'block';
        status.textContent = 'Теперь нажми “Начать запись”';
      });

      // Шаг 2: запрашиваем микрофон только после «доверенного действия»
      startBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);

          recorder.ondataavailable = e => chunks.push(e.data);

          recorder.onstop = () => {
            // Освобождаем предыдущую ссылку, чтобы не забивать память
            if (lastUrl) URL.revokeObjectURL(lastUrl);

            const blob = new Blob(chunks, { type: 'audio/webm' });
            chunks.length = 0; // очищаем массив

            lastUrl = URL.createObjectURL(blob);

            // Показываем кнопки: послушать и скачать
            status.innerHTML = `
              <b>✅ Готово!</b><br>
              <div class="action-buttons">
                <button id="playBtn" style="background-color: #007bff;">🔊 Послушать запись</button>
                <a href="${lastUrl}" download="recording.webm" class="download-link">⬇️ Скачать .webm</a>
              </div>
            `;

            document.getElementById('playBtn').addEventListener('click', () => {
              const audio = new Audio(lastUrl);
              audio.controls = true;
              audio.style.width = '100%';
              status.innerHTML = '';
              status.appendChild(audio);
              audio.play().catch(e => console.error('Автовоспроизведение заблокировано', e));
            });
          };

          recorder.start();
          startBtn.disabled = true;
          stopBtn.style.display = 'block';
          stopBtn.disabled = false;
          status.textContent = 'Запись...';
        } catch (err) {
          console.error(err);
          status.textContent = '❌ Ошибка доступа к микрофону';
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recorder) recorder.stop();
      });
    </script>
  </body>
</html>
