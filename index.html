<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аудио-тест (MP4 для iPhone)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f4f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .status { margin-top: 12px; font-size: 0.9rem; color: #555; min-height: 1.2em; }
      button {
        padding: 16px 24px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }
      button:active { transform: scale(0.97); }
      #startBtn { background-color: #007aff; width: 100%; max-width: 300px; }
      #stopBtn {
        background-color: #ff3b30;
        width: 100%;
        max-width: 300px;
        margin-top: 8px;
        display: none;
      }
      .action-buttons button,
      .action-buttons a {
        margin-top: 10px;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 10px;
        color: white;
      }
      a.download-link {
        display: inline-block;
        background-color: #28a745;
      }
    </style>
  </head>
  <body>
    <h1>Тест рекордера (MP4)</h1>

    <button id="startBtn">Начать запись</button>
    <button id="stopBtn" disabled>Стоп</button>
    <div class="status" id="status"></div>

    <script>
      let recorder = null;
      const chunks = [];
      let lastUrl = null;

      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const status = document.getElementById('status');

      startBtn.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          // ГЛАВНОЕ ИЗМЕНЕНИЕ:
          // Safari на iPhone умеет ТОЛЬКО писать в этот формат.
          // Это сразу готовый MP4 с AAC внутри. Конвертация не нужна.
          const options = { mimeType: 'audio/mp4; codecs=aac' };
          recorder = new MediaRecorder(stream, options);

          recorder.ondataavailable = e => chunks.push(e.data);

          recorder.onstop = () => {
            if (lastUrl) URL.revokeObjectURL(lastUrl);

            // Теперь это реально MP4 файл
            const blob = new Blob(chunks, { type: 'audio/mp4' });
            chunks.length = 0;

            lastUrl = URL.createObjectURL(blob);

            status.innerHTML = `
              <b>✅ Готово!</b><br>
              <div class="action-buttons">
                <button onclick="playAudio('${lastUrl}')" style="background-color: #007bff;">🔊 Послушать</button>
                <a href="${lastUrl}" download="recording.mp4" class="download-link">⬇️ Скачать .mp4</a>
              </div>
            `;
          };

          recorder.start();
          startBtn.disabled = true;
          stopBtn.style.display = 'block';
          stopBtn.disabled = false;
          status.textContent = 'Запись...';
        } catch (err) {
          console.error(err);
          status.textContent = '❌ Ошибка доступа к микрофону. Проверь разрешения в Safari.';
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recorder) recorder.stop();
      });

      function playAudio(url) {
        const audio = new Audio(url);
        audio.controls = true;
        audio.style.width = '100%';
        status.innerHTML = '';
        status.appendChild(audio);
        audio.play().catch(e => console.log('Автоплей заблокирован браузером'));
      }
    </script>
  </body>
</html>
